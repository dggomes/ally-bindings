name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify, package and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/AllyBindings.Windows/AllyBindings.Windows.csproj
          $appVersion = [version]$project.Project.PropertyGroup.Version
          $tagVersion = [version]($env:GITHUB_REF_NAME.TrimStart('v'))
          if ($appVersion -ne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $appVersion"
          }
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Exercise updater replacement and startup handshake
        shell: powershell
        run: ./scripts/test-updater-installer.ps1 -PackageRoot artifacts/AllyBindings-win-x64 -RepositoryRoot $PWD
      - name: Exercise updater config and binary rollback
        shell: powershell
        run: ./scripts/test-updater-rollback.ps1 -RepositoryRoot $PWD
      - name: Assert passive capture cannot write or capture a whole root hub
        shell: powershell
        run: ./scripts/test-capture-safety.ps1
      - name: Name and hash release assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Copy-Item artifacts/AllyBindings-win-x64.zip "artifacts/AllyBindings-$tag-win-x64.zip"
          Copy-Item artifacts/AllyBindings-win-x64/AllyBindings.exe "artifacts/AllyBindings-$tag-win-x64.exe"
          Get-FileHash "artifacts/AllyBindings-$tag-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  AllyBindings-$tag-win-x64.zip" } |
            Set-Content "artifacts/AllyBindings-$tag-win-x64.zip.sha256" -NoNewline
          ./scripts/get-release-notes.ps1 -Tag $tag -OutputPath artifacts/release-notes.md
      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag --repo $env:GITHUB_REPOSITORY --prerelease --title "Ally Bindings $tag — Preview" --notes-file artifacts/release-notes.md `
            "artifacts/AllyBindings-$tag-win-x64.zip#Recommended Windows x64 package" `
            "artifacts/AllyBindings-$tag-win-x64.zip.sha256#Package SHA-256" `
            "artifacts/AllyBindings-$tag-win-x64.exe#Standalone Windows x64 executable"
