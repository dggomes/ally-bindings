name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify, package and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $evaluated = dotnet msbuild src/AllyBindings.Windows/AllyBindings.Windows.csproj -getProperty:Version -getProperty:FileVersion -getProperty:AssemblyVersion | ConvertFrom-Json
          $appVersion = [string]$evaluated.Properties.Version
          $previewSemVer = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)$'
          if ($env:GITHUB_REF_NAME -notmatch $previewSemVer) {
            throw "Tag $env:GITHUB_REF_NAME is not a strict semantic-version preview tag"
          }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($appVersion -cne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $appVersion"
          }
      - name: Verify tagged commit descends from main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit $env:GITHUB_SHA is not reachable from origin/main"
          }
      - name: Verify Windows USB ETW providers and FullDataBusTrace
        shell: pwsh
        run: ./scripts/test-etw-provider.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify built Windows version metadata
        shell: pwsh
        run: ./scripts/test-version-metadata.ps1
      - name: Enforce release package contents and size budget
        shell: pwsh
        run: ./scripts/test-release-package.ps1
      - name: Exercise ETW helper peer authentication and executable lock
        shell: pwsh
        run: ./scripts/test-etw-helper-auth.ps1
      - name: Exercise startup tray and second-instance activation
        shell: pwsh
        run: ./scripts/test-single-instance-activation.ps1
      - name: Assert controller-first UI and capture discoverability
        shell: pwsh
        run: ./scripts/test-controller-ui.ps1
      - name: Exercise WPF touch surfaces and visual mapping workflow
        shell: pwsh
        run: ./scripts/test-ui-automation.ps1
      - name: Capture tagged WPF UI screenshots
        shell: pwsh
        run: ./scripts/capture-ui-screenshots.ps1
      - name: Refresh packaged documentation with tagged screenshots
        shell: pwsh
        run: ./scripts/refresh-package-screenshots.ps1
      - name: Exercise updater replacement and startup handshake
        shell: powershell
        run: ./scripts/test-updater-installer.ps1 -PackageRoot artifacts/AllyBindings-win-x64 -RepositoryRoot $PWD
      - name: Exercise updater config and binary rollback
        shell: powershell
        run: ./scripts/test-updater-rollback.ps1 -RepositoryRoot $PWD
      - name: Assert passive capture cannot write or persist a whole USB trace
        shell: powershell
        run: ./scripts/test-capture-safety.ps1
      - name: Name and hash release assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Copy-Item artifacts/AllyBindings-win-x64.zip "artifacts/AllyBindings-$tag-win-x64.zip"
          Copy-Item artifacts/AllyBindings-win-x64/AllyBindings.exe "artifacts/AllyBindings-$tag-win-x64.exe"
          Get-FileHash "artifacts/AllyBindings-$tag-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  AllyBindings-$tag-win-x64.zip" } |
            Set-Content "artifacts/AllyBindings-$tag-win-x64.zip.sha256" -NoNewline
          Get-FileHash "artifacts/AllyBindings-$tag-win-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  AllyBindings-$tag-win-x64.exe" } |
            Set-Content "artifacts/AllyBindings-$tag-win-x64.exe.sha256" -NoNewline
          ./scripts/get-release-notes.ps1 -Tag $tag -OutputPath artifacts/release-notes.md
      - name: Create draft preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $existingJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) { throw "Refusing to replace an already-published release for $tag" }
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --prerelease --title "Ally Bindings $tag — Preview" --notes-file artifacts/release-notes.md `
            "artifacts/AllyBindings-$tag-win-x64.zip#Recommended Windows x64 package" `
            "artifacts/AllyBindings-$tag-win-x64.zip.sha256#Package SHA-256" `
            "artifacts/AllyBindings-$tag-win-x64.exe#Standalone Windows x64 executable" `
            "artifacts/AllyBindings-$tag-win-x64.exe.sha256#Standalone executable SHA-256"
      - name: Verify uploaded draft assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $verify = Join-Path $PWD 'artifacts/release-verification'
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $verify

          foreach ($kind in @('zip', 'exe')) {
            $asset = Join-Path $verify "AllyBindings-$tag-win-x64.$kind"
            $hashFile = "$asset.sha256"
            $expected = ((Get-Content -LiteralPath $hashFile -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected) { throw "Uploaded $kind hash mismatch: expected $expected, got $actual" }
          }

          $expanded = Join-Path $verify 'expanded'
          Expand-Archive -LiteralPath (Join-Path $verify "AllyBindings-$tag-win-x64.zip") -DestinationPath $expanded
          ./scripts/test-release-package.ps1 -PackageRoot $expanded -ZipPath (Join-Path $verify "AllyBindings-$tag-win-x64.zip")

          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease | ConvertFrom-Json
          if ($release.tagName -cne $tag -or $release.name -cne "Ally Bindings $tag — Preview" -or
              -not $release.isDraft -or -not $release.isPrerelease) {
            throw "Draft release metadata verification failed"
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease

          $publicVerify = Join-Path $PWD 'artifacts/public-release-verification'
          New-Item -ItemType Directory -Force -Path $publicVerify | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $publicVerify
          $expectedNames = @(
            "AllyBindings-$tag-win-x64.exe",
            "AllyBindings-$tag-win-x64.exe.sha256",
            "AllyBindings-$tag-win-x64.zip",
            "AllyBindings-$tag-win-x64.zip.sha256"
          ) | Sort-Object
          $actualNames = @(Get-ChildItem -LiteralPath $publicVerify -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actualNames -join "`n") -cne ($expectedNames -join "`n")) {
            throw "Published release asset allowlist mismatch: $($actualNames -join ', ')"
          }
          foreach ($kind in @('zip', 'exe')) {
            $asset = Join-Path $publicVerify "AllyBindings-$tag-win-x64.$kind"
            $expected = (((Get-Content -LiteralPath "$asset.sha256" -Raw).Trim()) -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected) { throw "Published $kind hash mismatch: expected $expected, got $actual" }
          }
          $publicExpanded = Join-Path $publicVerify 'expanded'
          Expand-Archive -LiteralPath (Join-Path $publicVerify "AllyBindings-$tag-win-x64.zip") -DestinationPath $publicExpanded
          ./scripts/test-release-package.ps1 -PackageRoot $publicExpanded -ZipPath (Join-Path $publicVerify "AllyBindings-$tag-win-x64.zip")
          $published = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease | ConvertFrom-Json
          if ($published.tagName -cne $tag -or $published.name -cne "Ally Bindings $tag — Preview" -or
              $published.isDraft -or -not $published.isPrerelease) {
            throw "Published release metadata verification failed"
          }
