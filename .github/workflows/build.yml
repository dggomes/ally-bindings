name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/AllyBindings.Core.Tests/AllyBindings.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=core.trx"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: core-test-results
          path: tests/AllyBindings.Core.Tests/TestResults/

  windows:
    name: Windows build and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AllyBindings.sln
      - name: Build native Armoury tap DLL (x64)
        shell: pwsh
        run: ./scripts/build-armoury-tap.ps1
      - name: Test
        run: dotnet test AllyBindings.sln --no-restore --configuration Release --logger "trx;LogFileName=windows.trx"
      - name: Publish self-contained x64 app
        shell: pwsh
        run: ./scripts/package.ps1 -SkipTests
      - name: Build private one-shot M1/M2 hardware validator
        shell: pwsh
        run: ./scripts/package-hardware-validator.ps1 -SkipTests
      - name: Assert private hardware validator write boundaries
        shell: pwsh
        run: ./scripts/test-hardware-validator-safety.ps1
      - name: Exercise read-free hardware validator inspect mode
        shell: pwsh
        run: ./scripts/test-hardware-validator-inspect.ps1
      - name: Verify embedded Armoury tap resource
        shell: pwsh
        run: ./scripts/test-armoury-tap-embedded-resource.ps1
      - name: Verify built Windows version metadata
        shell: pwsh
        run: ./scripts/test-version-metadata.ps1
      - name: Verify withdrawn release policy
        shell: pwsh
        run: ./scripts/test-withdrawn-release-policy.ps1
      - name: Enforce release package contents and size budget
        shell: pwsh
        run: ./scripts/test-release-package.ps1
      - name: Exercise ETW helper peer authentication and executable lock
        shell: pwsh
        run: ./scripts/test-etw-helper-auth.ps1
      - name: Exercise startup tray and second-instance activation
        shell: pwsh
        run: ./scripts/test-single-instance-activation.ps1
      - name: Assert controller-first UI and capture discoverability
        shell: pwsh
        run: ./scripts/test-controller-ui.ps1
      - name: Exercise WPF touch surfaces and visual mapping workflow
        shell: pwsh
        run: ./scripts/test-ui-automation.ps1
      - name: Capture real WPF UI screenshots
        shell: pwsh
        run: ./scripts/capture-ui-screenshots.ps1
      - name: Refresh packaged documentation with captured screenshots
        shell: pwsh
        run: ./scripts/refresh-package-screenshots.ps1
      - name: Exercise updater download-to-verification handoff
        shell: pwsh
        run: ./scripts/test-update-download-handoff.ps1
      - name: Reject staged executable tampering after verification
        shell: powershell
        run: ./scripts/test-updater-tamper.ps1 -PackageRoot artifacts/AllyBindings-win-x64 -RepositoryRoot $PWD
      - name: Exercise updater replacement and startup handshake
        shell: powershell
        run: ./scripts/test-updater-installer.ps1 -PackageRoot artifacts/AllyBindings-win-x64 -RepositoryRoot $PWD
      - name: Exercise updater config and binary rollback
        shell: powershell
        run: ./scripts/test-updater-rollback.ps1 -RepositoryRoot $PWD
      - name: Assert integrated capture write-lock and privacy boundaries
        shell: powershell
        run: ./scripts/test-capture-safety.ps1
      - name: Exercise Armoury tap config, teardown and ACL runtime contracts
        shell: pwsh
        run: ./scripts/test-armoury-tap-runtime.ps1
      - name: Assert read-only feature snapshot isolation and zero authority
        shell: powershell
        run: ./scripts/test-feature-snapshot-safety.ps1
      - name: Verify required Windows USB ETW providers and FullDataBusTrace
        shell: pwsh
        run: ./scripts/test-etw-provider.ps1
      - name: Validate changelog release-note extraction
        shell: pwsh
        run: ./scripts/get-release-notes.ps1 -Tag v0.3.0-preview.2 -OutputPath artifacts/release-notes-test.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AllyBindings-win-x64
          path: artifacts/AllyBindings-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AllyBindings-private-hardware-validator-win-x64
          path: artifacts/AllyBindings-HardwareValidator-win-x64.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AllyBindings-ui-screenshots
          path: artifacts/ui-screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-test-results
          path: "**/TestResults/*.trx"
