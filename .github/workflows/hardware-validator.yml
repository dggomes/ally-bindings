name: controlled hardware validator

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact trusted main-branch commit SHA approved for the physical lab run
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: controlled-hardware-validator-${{ github.sha }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.approved_sha == github.sha
    name: Approved RC73XA one-shot validator
    runs-on: windows-latest
    environment: hardware-lab-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.423
      - name: Assert approved revision
        shell: pwsh
        run: |
          if ((dotnet --version).Trim() -ne '8.0.423') { throw 'Unexpected .NET SDK version.' }
          if ('${{ inputs.approved_sha }}' -ne '${{ github.sha }}') { throw 'Approved SHA mismatch.' }
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'Checked-out SHA mismatch.' }
      - name: Run standalone golden-vector and target-gate tests
        shell: pwsh
        run: dotnet test tests/AllyBindings.HardwareValidator.Tests/AllyBindings.HardwareValidator.Tests.csproj --configuration Release --logger "trx;LogFileName=hardware-validator.trx"
      - name: Build exact controlled package
        shell: pwsh
        run: ./scripts/package-hardware-validator.ps1 -SkipTests
      - name: Verify embedded UAC manifest
        shell: pwsh
        run: ./scripts/test-hardware-validator-pe.ps1
      - name: Exercise read-free inspect on non-target runner
        shell: pwsh
        run: ./scripts/test-hardware-validator-inspect.ps1
      - name: Record independently visible outer ZIP provenance
        id: provenance
        shell: pwsh
        run: |
          $zip = 'artifacts/AllyBindings-HardwareValidator-win-x64.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  AllyBindings-HardwareValidator-win-x64.zip"
          [IO.File]::WriteAllText('artifacts/OUTER-SHA256.txt', "$line`n", [Text.UTF8Encoding]::new($false))
          "### Controlled hardware validator provenance" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          "- ZIP SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "- Approval environment: hardware-lab-approval" >> $env:GITHUB_STEP_SUMMARY
      - name: Attest exact ZIP provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/AllyBindings-HardwareValidator-win-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AllyBindings-HardwareValidator-win-x64-${{ github.sha }}
          path: |
            artifacts/AllyBindings-HardwareValidator-win-x64.zip
            artifacts/OUTER-SHA256.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: HardwareValidator-test-results-${{ github.sha }}
          path: tests/AllyBindings.HardwareValidator.Tests/TestResults/
          retention-days: 1
